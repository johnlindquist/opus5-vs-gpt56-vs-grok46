<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinetic Poster Foundry — Type as Physics</title>
  <link rel="stylesheet" href="foundry.css">
</head>
<body>
  <a class="skip-link" href="#phrase">Skip to phrase</a>

  <div class="stage" id="stage">
    <canvas id="poster" width="1600" height="900" aria-label="Kinetic poster canvas"></canvas>
  </div>

  <header class="mast">
    <p class="mast-kicker">Kinetic Poster Foundry</p>
    <p class="mast-live" id="status" role="status" aria-live="polite">FRONTIER / NIGHT — Electric ribbon</p>
  </header>

  <aside class="dock" aria-label="Poster controls">
    <div class="dock-row">
      <label class="field grow">
        <span>Phrase</span>
        <input id="phrase" type="text" value="FRONTIER / NIGHT" maxlength="96" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span>Font</span>
        <select id="font">
          <option value="editorial">Editorial serif</option>
          <option value="grotesk">Grotesk</option>
          <option value="mono">Mono signal</option>
        </select>
      </label>
      <label class="field">
        <span>Layout</span>
        <select id="layout">
          <option value="auto">Auto / split</option>
          <option value="one">One line</option>
          <option value="two">Two line</option>
        </select>
      </label>
      <label class="field">
        <span>Align</span>
        <select id="align">
          <option value="center">Center</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
        </select>
      </label>
    </div>

    <div class="dock-row sliders">
      <label class="field">
        <span>Density</span>
        <input id="density" type="range" min="0.35" max="1.6" step="0.05" value="1">
      </label>
      <label class="field">
        <span>Stiffness</span>
        <input id="stiffness" type="range" min="0.02" max="0.28" step="0.005" value="0.09">
      </label>
      <label class="field">
        <span>Damping</span>
        <input id="damping" type="range" min="0.72" max="0.96" step="0.005" value="0.86">
      </label>
      <label class="field">
        <span>Trail</span>
        <input id="trail" type="range" min="0" max="0.72" step="0.02" value="0.42">
      </label>
      <label class="field">
        <span>Glow</span>
        <input id="glow" type="range" min="0" max="1" step="0.02" value="0.7">
      </label>
      <label class="field">
        <span>Margins</span>
        <input id="margins" type="range" min="48" max="180" step="2" value="96">
      </label>
    </div>

    <div class="dock-row">
      <label class="field">
        <span>Palette</span>
        <select id="palette">
          <option value="voltage">Voltage</option>
          <option value="mercury">Mercury</option>
          <option value="nocturne">Nocturne</option>
          <option value="phosphor">Phosphor</option>
        </select>
      </label>
      <label class="check">
        <input id="marks" type="checkbox" checked>
        <span>Crop marks</span>
      </label>
      <div class="presets" role="group" aria-label="Curated presets">
        <button type="button" data-preset="0" class="on">1 Electric</button>
        <button type="button" data-preset="1">2 Chrome</button>
        <button type="button" data-preset="2">3 Ink</button>
        <button type="button" data-preset="3">4 Signal</button>
      </div>
      <button type="button" id="export" class="export">Export PNG</button>
    </div>

    <p class="hint">Move: wind · Drag: vortex · Release: ripple · Space: impulse · R: rest · P: pause · 1–4: presets</p>
  </aside>

  <script src="foundry.js"></script>
</body>
</html>
